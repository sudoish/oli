[package]
name = "oli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A minimal, hackable, scriptable coding-agent runtime."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sudoish/oli"
readme = "README.md"
keywords = ["agent", "llm", "cli", "automation", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "signal", "sync"] }
clap = { version = "4.3.14", features = ["derive"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1"
thiserror = "2"
toml = "0.8"
# Format-preserving TOML editing for `oli login`, which rewrites the
# user's hand-maintained config.toml. `toml` would round-trip it
# through a value tree and drop every comment and blank line.
# Already in the tree: `toml` is built on it.
toml_edit = "0.25"
glob = "0.3"
futures = "0.3"
rustyline = "14"
mlua = { version = "0.10", features = ["lua54", "vendored", "async", "send", "serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
similar = "2"
libc = "0.2.186"
# ChatGPT-subscription OAuth (`src/auth/`): PKCE S256 challenge, the
# base64url-nopad alphabet shared by PKCE + JWT payloads, and a CSPRNG
# for the code verifier / `state` nonce. Deliberately kept to three
# small crates — percent-encoding, XDG lookup and clock arithmetic are
# hand-rolled against `std` rather than pulling `url`/`dirs`/`chrono`.
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
