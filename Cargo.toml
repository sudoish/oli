[package]
name = "oli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A minimal, hackable, single-binary terminal coding agent."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sudoish/oli"
readme = "README.md"
keywords = ["agent", "llm", "cli", "tui", "ai"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Default ships the full experience: TUI + code-fence syntax highlighting.
# `cargo build --no-default-features` produces a line-mode-only binary
# (~2-3 MB smaller) that's useful for piped CI usage where the TUI deps
# are dead weight.
default = ["tui", "syntax-highlight"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-textarea-2", "dep:pulldown-cmark"]
syntax-highlight = ["tui", "dep:syntect"]
# Phase Y3: inline image rendering via ratatui-image. Off by default —
# adds a ~1 MB image-decode stack to the release binary. With this
# feature, image-typed tool results (e.g. `Read` of a PNG) render
# inline using the host's best graphics protocol (Kitty / iTerm2 /
# Sixel) or a unicode half-block fallback. Without it, the same tool
# result is shown as a plain `[Image: path WxH FORMAT]` text marker.
images = ["tui", "dep:ratatui-image", "dep:image"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "signal"] }
clap = { version = "4.3.14", features = ["derive"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1"
thiserror = "2"
toml = "0.8"
glob = "0.3"
futures = "0.3"
rustyline = "14"
mlua = { version = "0.10", features = ["lua54", "vendored", "async", "send", "serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
similar = "2"
libc = "0.2.186"
nucleo-matcher = "0.3"
# ChatGPT-subscription OAuth (`src/auth/`): PKCE S256 challenge, the
# base64url-nopad alphabet shared by PKCE + JWT payloads, and a CSPRNG
# for the code verifier / `state` nonce. Deliberately kept to three
# small crates — percent-encoding, XDG lookup and clock arithmetic are
# hand-rolled against `std` rather than pulling `url`/`dirs`/`chrono`.
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

# Optional: gated behind feature flags above.
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, used to
# size the `insert_before` scrollback buffer exactly in inline mode (see
# specs/tui-inline-rework.md). ratatui is pinned to an exact 0.30.0, so
# the unstable-API churn risk is bounded by the lockfile.
ratatui = { version = "0.30.0", optional = true, features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
tui-textarea-2 = { version = "0.10.2", optional = true }
pulldown-cmark = { version = "0.13.3", optional = true }
syntect = { version = "5.3.0", optional = true }
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm", "image-defaults"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }

[dev-dependencies]
tempfile = "3"
