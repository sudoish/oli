[package]
name = "oli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A minimal, hackable, single-binary terminal coding agent."

[features]
# Default ships the full experience: TUI + code-fence syntax highlighting.
# `cargo build --no-default-features` produces a line-mode-only binary
# (~2-3 MB smaller) that's useful for piped CI usage where the TUI deps
# are dead weight.
default = ["tui", "syntax-highlight"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-textarea-2", "dep:pulldown-cmark"]
syntax-highlight = ["tui", "dep:syntect"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "signal"] }
clap = { version = "4.3.14", features = ["derive"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1"
thiserror = "2"
toml = "0.8"
glob = "0.3"
futures = "0.3"
rustyline = "14"
mlua = { version = "0.10", features = ["lua54", "vendored", "async", "send", "serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
similar = "2"
libc = "0.2.186"

# Optional: gated behind feature flags above.
ratatui = { version = "0.30.0", optional = true }
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
tui-textarea-2 = { version = "0.10.2", optional = true }
pulldown-cmark = { version = "0.13.3", optional = true }
syntect = { version = "5.3.0", optional = true }

[dev-dependencies]
tempfile = "3"
