[package]
name = "oli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A minimal, hackable, single-binary terminal coding agent."

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "signal"] }
clap = { version = "4.3.14", features = ["derive"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1"
thiserror = "2"
toml = "0.8"
glob = "0.3"
futures = "0.3"
rustyline = "14"
mlua = { version = "0.10", features = ["lua54", "vendored", "async", "send", "serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
similar = "2"

[dev-dependencies]
tempfile = "3"
