name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          # Oli intentionally has one text-first feature surface. Keep both
          # Cargo boundary forms green so downstream minimal-build scripts do
          # not regress if features are introduced later.
          - --no-default-features
          - --all-features
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Check ${{ matrix.features }}
      run: cargo check ${{ matrix.features }}

  # Advisory only. `cargo fmt --check` currently differs across 38 files and
  # clippy reports 75 warnings, so neither gates the build yet — a red X on
  # every push teaches people to ignore CI. Promote these to blocking (add
  # `-D warnings`, drop continue-on-error) once the backlog is cleared.
  lint:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features
